           Create Transaction, the message dialog raised on Save and Close.
  Date   : 2026-09-09
  Via    : scripted Playwright probe, document.querySelector('[id$="::msgDlg"]').outerHTML

  This run hit the ERROR variant ("You can't update the ship-to customer site
  on this transaction. (AR-856788)") because the probe skipped the Ship-to Site
  step. The container is the same one used for Information / Warning /
  Confirmation -- ADF reuses a single `d1::msgDlg` and swaps the title text and
  the wrapper class -- so the structure here is the structure for all of them.
  Only `::_ttxt` and the `p_AFError` class distinguish the kinds.

  WHY THIS FIXTURE EXISTS -- measured on the same page, same moment:

    document.querySelectorAll('[role="dialog"],[role="alertdialog"]')  -> 0
    document.querySelectorAll('dialog')                                -> 0
    document.querySelectorAll(':modal')                                -> 0   (supported, matched nothing)

  So NONE of Playwright's dialog affordances can see this thing:
    - page.on('dialog')            native alert/confirm/prompt only; there are none
    - getByRole('dialog')          no role attribute anywhere in the subtree
    - getByRole('alertdialog')     same
    - CSS :modal                   needs <dialog>.showModal() or fullscreen

  The only handle is the ADF id convention, which is why the replayer scopes on
  it:
    [id$="::msgDlg"]            the container
    [id$="::msgDlg::_ttxt"]     title      -> "Error" here, "Information" on success
    [id$="::msgDlg::_cnt"]      body       -> the message text to capture
    [id$="::msgDlg::cancel"]    the OK button  (<button>, matches the recording's
                                               componentId "d1::msgDlg::cancel")
    [id$="::msgDlg::close"]     the X       (<a title="Close">)

  The `d1` prefix is a page-level container id and is not guaranteed, hence
  suffix matching throughout.
-->
