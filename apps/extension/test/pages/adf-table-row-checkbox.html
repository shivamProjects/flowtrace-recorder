<title>ADF editable table - per-row Enabled checkbox (Manage Asset Locations)</title>
<!--
  VERBATIM capture. Do not tidy.

  Source : exsp-dev33.ds-fa.oraclepdemos.com
           Setup and Maintenance > Fixed Assets > Manage Asset Locations,
           the locations results table after adding two rows.
  Date   : 2026-09-09
  Via    : Playwright, document.querySelector('[id$=":_ATp::_ahCt"]').outerHTML

  WHAT THIS FIXTURE PROVES (all measured on the live page, not inferred):

  1. The Enabled checkbox has NO ACCESSIBLE NAME.
       <input id="...:table1:1:sbc1::content" type="checkbox" value="t"
              aria-labelledby="...:table1:1:sbc1::Label0">
       <label for="...::content" id="...::Label0" class="x17j">
         <span class="x17e"></span>        <-- EMPTY
       </label>
     aria-labelledby is PRESENT but resolves to empty text, which is worse than
     absent: it looks like the app named the control. Measured on the input:
       ariaLabel=null  title=null  closestLabel=false  ownText=""  labelForText=""

  2. The only human-readable name is the COLUMN HEADER, in a separate table:
       th#...:table1:c6 > div.x1tz > span.af_column_label-text  ->  "Enabled"
     Map cell -> column with `_leafcolclientids` on the table div, which lists
     the leaf columns in order:
       c7, locKffCol_flexSub0..3, c4, c5, c6
       (row-hdr, Country, State/County, City, Building, Eff-Start, Eff-End, Enabled)
     The data row's tds align to that list, sbc1 last -> c6 -> "Enabled".

  3. ONLY THE ACTIVE ROW HAS INPUT CONTROLS. Row 1 here is active and carries
     the real <input type=checkbox>; row 0 is read-only and its Enabled cell
     renders the literal word "Enabled" as TEXT. So:
       - a recorder that reads cell text captures the word "Enabled" as a value;
       - a replayer must ACTIVATE the target row before it can set the box.

  4. Row identity is the numeric index, in two places that agree:
       tr[_afrrk="1"]  and  ...:table1:1:sbc1::content
     This is what keeps per-row state from being interchanged. Matching a
     checkbox record to a step by LABEL TEXT cannot work here - every row's box
     is named "Enabled".

  5. A toggle that is not committed can be reverted by ADF's next PPR render.
     Observed: unchecking row 1 then clicking another row left row 1 checked
     again. Same family as the uncommitted-fill defect.
-->
