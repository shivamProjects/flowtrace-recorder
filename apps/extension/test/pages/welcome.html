<!doctype html>
<html>
<head><meta charset="utf-8"><title>Welcome</title></head>
<body>
<!--
  Synthetic — where signin.html lands once the credentials are accepted.

  Nothing here may read as a sign-in screen: no "sign in" in the title, none in
  the first 400 characters of body text. That is exactly what sessionExpired()
  inspects, so a stray "Sign in again" link would make a successful login look
  like a failed one.
-->
<h1>Welcome</h1>
<p id="out">Signed in</p>
<a href="#" id="home">Home</a>
</body>
</html>
