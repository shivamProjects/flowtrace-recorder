<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FlowTrace Recorder</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }
    .logo-container {
      margin-bottom: 28px;
      animation: fadeInDown 0.6s ease-out;
    }
    .logo-container img {
      max-width: 180px;
      max-height: 80px;
      width: auto;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 24px rgba(59, 130, 246, 0.25));
    }
    .app-name {
      font-size: 22px;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 8px;
      animation: fadeInDown 0.6s ease-out 0.1s both;
    }
    .app-version {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 40px;
      animation: fadeInDown 0.6s ease-out 0.15s both;
    }
    .progress-container {
      width: 280px;
      animation: fadeIn 0.6s ease-out 0.3s both;
    }
    .progress-track {
      width: 100%;
      height: 4px;
      background: #1e293b;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 2px;
      width: 0%;
      transition: width 0.4s ease-out;
    }
    .status-text {
      font-size: 13px;
      color: #94a3b8;
      text-align: center;
      min-height: 20px;
      transition: opacity 0.2s;
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img id="logo" src="" alt="FlowTrace">
  </div>
  <div class="app-name">FlowTrace Recorder</div>
  <div class="app-version" id="versionText"></div>
  <div class="progress-container">
    <div class="progress-track">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="status-text" id="statusText">Initializing...</div>
  </div>
  <script>
    window.addEventListener('message', (event) => {
      const { progress, status } = event.data || {};
      if (progress !== undefined) document.getElementById('progressBar').style.width = progress + '%';
      if (status !== undefined) document.getElementById('statusText').textContent = status;
    });
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const logo = params.get('logo');
      const version = params.get('version');
      if (logo) document.getElementById('logo').src = logo;
      if (version) document.getElementById('versionText').textContent = 'V' + version;
    });
  </script>
</body>
</html>
