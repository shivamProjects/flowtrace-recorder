  Captured live from Oracle Fusion, Create Sales Order (ibqwjb-test), 2026-08-31.
  This is the Ship-to Contact picker in its EMPTY state — the state a replay
  always meets. Do not hand-edit: recapture from the live page instead.

  Two things this fixture pins:
   1. the <label> lives INSIDE the widget on a branch that does not contain the
      input, so closest("[role=combobox]") from the label never reaches it;

-->
