  The few rules the captured markup CANNOT do without.

  Oracle's LOV search icon is an EMPTY <a class="x1o2"> sized entirely by a CSS
  background sprite. Without a stylesheet it measures 0x0, and the engine's
  painted-element check (width>1 && height>1, see firstPaintedIndex in
  locators.ts) correctly rejects it — so a fixture with no CSS tests a condition
  that never occurs on the live page, and every LOV launcher case fails for the
  wrong reason.

  Only geometry is reproduced, not Oracle's appearance. Anything beyond making
  the elements real-sized would be inventing detail the capture does not have.
*/
a.x1o2 { display: inline-block; width: 16px; height: 16px; background: #ccc; }
.x1lb  { border: 1px solid #999; background: #fff; }
.x1hg td { padding: 2px 4px; }

  This page collects the widgets that have actually broken a replay, each with a
  note on how. Add to it rather than inventing markup: every wrong diagnosis in
  this engine so far came from reasoning about ADF from memory.

  ── what is here, and why ──────────────────────────────────────────────────
  1. selectOption whose recorded value is the option's VALUE attribute ("1"),
     not its label. The ladder selects it correctly by value; verification that
     compared against the LABEL then failed a step that had just worked.
     (execution 8354, step 21)

  2. An LOV dropdown as ADF really renders it: a two-column grid where the CODE
     is one cell and the DISPLAY TEXT another, rows addressed by `_afrrk`. The
     currently-selected row is REPEATED at the top (ORA_K appears at _afrrk 0
     and 4) with a separator row between, so a text match can hit either copy
     and "first match" is not "the row the operator picked".

  3. Two LOV fields whose search icons are empty <a> elements sized entirely by
     CSS background — 0x0 without the application stylesheet, so a visibility
     check rejects them.

  4. Disabled inputs a recording must never try to fill.
-->

<!--
  6. THE OPEN LOV DROPDOWN, verbatim.

  Two columns: code, then display text. Rows carry `_afrrk`. The selected row
  (ORA_K / "Quarterly.") is repeated at _afrrk=0 above a separator row, then the
  full list follows from _afrrk=2 — so ORA_K appears TWICE and a text match on
  "Quarterly." has two candidates in different positions.

  A row-pick recorded as bare text (internal:text="Disposable.") carries no code
  and no rank, so it can only be resolved by matching the display cell. That
  works while the text is unique, and silently picks the wrong row the moment it
  is not.
-->
<div class="x1lb" id="lovdrop" style="display:none">
  <div id="B:DeprFreq::dropdownPopup::content">
    <div tabindex="0" id="B:DeprFreq::dropdownPopup::dropDownContent" class="x1l9 xel" style="width:468px;height:260px;">
      <div id="B:DeprFreq::dropdownPopup::dropDownContent::db" class="x1hf" style="position:relative;width:468px;overflow:hidden;height:260px;" _afrcolcount="2">
        <table class="x1hg" style="table-layout:fixed;position:relative;width:468px;" cellspacing="0" _totalwidth="448" _selstate="{'0':1}" _rowcount="9" _startrow="0">
          <colgroup span="2"><col style="width:224px;"><col style="width:244px;"></colgroup>
          <tbody>
            <tr _afrrk="0" class="xem p_AFSelected"><td style="width:213px;line-height:14px;" nowrap="" class="xen"><span class="x2ey">ORA_K</span></td><td style="width:233px;line-height:14px;" nowrap="" class="xen"><span class="x2ey">Quarterly.</span></td></tr>
            <tr _afrrk="1" class="xem"><td style="height:3px;" nowrap="" class="xen x1i1" _afrseparator="true"><span class="x2ey"></span>&nbsp;</td><td style="height:3px;" nowrap="" class="xen x1i1" _afrseparator="true"><span class="x2ey"></span>&nbsp;</td></tr>
            <tr _afrrk="2" class="xem"><td style="line-height:14px;" nowrap="" class="xen"><span class="x2ey">ORA_I</span></td><td style="line-height:14px;" nowrap="" class="xen"><span class="x2ey">Other.</span></td></tr>
            <tr _afrrk="3" class="xem"><td style="line-height:14px;" nowrap="" class="xen"><span class="x2ey">ORA_J</span></td><td style="line-height:14px;" nowrap="" class="xen"><span class="x2ey">Disposable.</span></td></tr>
            <tr _afrrk="4" class="xem"><td style="line-height:14px;" nowrap="" class="xen"><span class="x2ey">ORA_K</span></td><td style="line-height:14px;" nowrap="" class="xen"><span class="x2ey">Quarterly.</span></td></tr>
            <tr _afrrk="5" class="xem"><td style="line-height:14px;" nowrap="" class="xen"><span class="x2ey">ORA_M</span></td><td style="line-height:14px;" nowrap="" class="xen"><span class="x2ey">Monthly.</span></td></tr>

            <tr _afrrk="7" class="xem"><td style="line-height:14px;" nowrap="" class="xen"><span class="x2ey">ORA_S</span></td><td style="line-height:14px;" nowrap="" class="xen"><span class="x2ey">Seasonal.</span></td></tr>
            <tr _afrrk="8" class="xem"><td style="line-height:14px;" nowrap="" class="xen"><span class="x2ey">ORA_X</span></td><td style="line-height:14px;" nowrap="" class="xen"><span class="x2ey">Not applicable.</span></td></tr>
          </tbody>
        </table>
      </div>
      <a id="B:DeprFreq::dropdownPopup::popupsearch" class="x1o4 xmx" onclick="this.focus();return false;" href="#">Search...</a>

<script>
  // Clicking the LOV icon opens the dropdown, as ADF does. Enough behaviour for
  // a launcher step to be checkable; nothing else about the widget is simulated.
  document.getElementById('B:DeprFreq::lovIconId').addEventListener('click', function (e) {
    e.preventDefault();
    document.getElementById('lovdrop').style.display = 'block';
  });
  // Picking a row writes its CODE into the field, which is what Oracle stores.
  document.querySelectorAll('#lovdrop tr[_afrrk]').forEach(function (tr) {
    tr.addEventListener('click', function () {
      var code = tr.querySelector('td .x2ey');
      if (!code || !code.textContent.trim()) return;
      document.getElementById('B:DeprFreq::content').value = code.textContent.trim();
      document.getElementById('lovdrop').style.display = 'none';
    });
  });
</script>
