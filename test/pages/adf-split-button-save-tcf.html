  Date   : 2026-09-08
  Via    : supplied by the client from the live page, pasted unchanged.

  A SECOND capture of the same split button, from a DIFFERENT panel instance.
  That is the entire point of keeping both:

    this file  pt1:_FOr1:0:_FONSr2:0:MAnt2:0:pt1:TCF:0:ap1:saveMenu::popEl
    sibling    pt1:_FOr1:1:_FONSr2:0:MAnt2:2:pt1:Trans1:0:ap110:saveMenu::popEl
    recording  pt1:_FOr1:1:_FONSr2:0:MAnt2:1:pt1:TCF:0:ap1:…

  Everything left of `saveMenu` moves — the _FOr1 index, the MAnt2 tab index,
  the panel name (TCF vs Trans1) and the ap suffix (ap1 vs ap110). The
  `saveMenu::popEl` tail does not. A launcher must therefore be addressed by id
  SUFFIX; the full id cannot survive a replay, and role+name collides with the
  Save button beside it.

  The popup ids renumber too — the Save menu is `m1` here and `m2` in the
  sibling capture — so nothing may key off those either.

  Also note the menu table here carries an explicit style="display: none;" that
  the sibling capture does not, and its menu item is tabindex="0" rather than
  -1. Both are why this is captured rather than written: the shape varies in
  ways nobody would think to invent.

  Wider than the sibling on purpose: it keeps the header, the h1, the kiosk
  button-bar wrappers and the ::eoi overflow buttons, so a click here traverses
  the same ancestor chain the recorder sees on the live page.
-->
