<!--
  Oracle Redwood — Create Sales Order, the BUSINESS UNIT picker, list open.
  Captured live from ibqwjb-test on 2026-08-26 by _out/probe-bu.js.
  Oracle's markup, unmodified.

  THIS IS A DIFFERENT WIDGET FROM redwood-picker.html, and the difference is the
  whole bug. Sales Channel is an oj-listview; Business Unit is an oj-TABLE:

                      Sales Channel (records fine)   Business Unit (loses value)
      component       oj-listview                    oj-table
      container       ul[role=grid]                  table[role=application]
      row             li[role=row]                   tr          (NO role)
      cell            div[role=gridcell]             td          (NO role)
      popup wrapper   matched by POPUP_SEL           div.oj-listbox-drop[role=presentation]

  Two independent failures follow, and either alone loses the value:

    1. insidePopup() is FALSE. POPUP_SEL has no entry matching
       `.oj-listbox-drop` / `[role=presentation]`, so the click never takes the
       popup branch in oracle-patch.js.

    2. recordClickField()'s closest() finds NOTHING. Its list asks for
       [role=gridcell] / [role=cell] / [role=row]; this markup carries none of
       them, so no target is resolved and the record is dropped.

  The id tail is genuinely stable — `1250645336` is McGrath RentCorp's row data
  key across recordings 1629, 1631, 1632 and 1633, four separate sessions. Only
  the `_ojNNN` prefix rotates.

  The value is present and addressable: it is the <td>'s own text.
-->
